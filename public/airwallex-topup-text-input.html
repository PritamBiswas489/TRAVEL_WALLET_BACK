<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AFT Wallet Top-up — Payment</title>
  <script src="/airwallex-sdk.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d1b17;
      color: #e6f0ec;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #12261f;
      border: 1px solid #1e3a30;
      border-radius: 12px;
      padding: 28px;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 4px;
    }

    .sub {
      font-size: 13px;
      color: #8fa89c;
      margin: 0 0 20px;
    }

    .amount {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    #dropIn {
      min-height: 220px;
    }

    #status {
      margin-top: 16px;
      font-size: 13px;
      display: none;
      padding: 10px 12px;
      border-radius: 8px;
    }

    #status.success {
      display: block;
      background: #133d2b;
      color: #7fe3a8;
    }

    #status.error {
      display: block;
      background: #3d1313;
      color: #e37f7f;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Wallet Top-up</h1>
    <p class="sub">Lametayel-Thailand</p>
    <div class="amount">10.00 ILS</div>
    <input id="intent_id" type="text" placeholder="Intent ID" style="width:100%;margin-bottom:10px;padding:10px;">
    <input id="client_secret" type="text" placeholder="Client Secret"
      style="width:100%;margin-bottom:10px;padding:10px;">
    <button id="loadBtn" style="width:100%;padding:10px;margin-bottom:15px;">Load Payment Form</button>
    <div id="dropIn"></div>
    <div id="status"></div>
  </div>

  <script src="/airwallex-topup-text-input.js" defer></script>
</body>

</html>
