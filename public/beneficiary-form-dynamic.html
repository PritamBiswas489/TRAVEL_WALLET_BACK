<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Beneficiary Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .badge {
            display: inline-block;
            background: #2ecc71;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 20px;
        }
        
        .badge.swift {
            background: #e74c3c;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        
        .required::after {
            content: " *";
            color: #e74c3c;
        }
        
        input[type="text"],
        input[type="email"],
        input[type="date"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        
        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="date"]:focus,
        input[type="number"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        
        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        
        .radio-option input[type="radio"] {
            cursor: pointer;
        }
        
        .radio-option label {
            margin: 0;
            cursor: pointer;
            font-weight: 400;
        }
        
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }
        
        .checkbox-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        
        .checkbox-option input[type="checkbox"] {
            cursor: pointer;
            width: 18px;
            height: 18px;
        }
        
        .checkbox-option label {
            margin: 0;
            cursor: pointer;
            font-weight: 400;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
        
        .help-text {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
        
        .info-box {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 13px;
            color: #666;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .success-message {
            display: none;
            background: #2ecc71;
            color: white;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .success-message.show {
            display: block;
        }
        
        .error-message {
            display: none;
            background: #e74c3c;
            color: white;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .error-message.show {
            display: block;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Loading form...</p>
        </div>
        
        <div id="formContainer" class="hidden">
            <div class="badge" id="transferBadge">LOCAL Transfer</div>
            <h1>Add Beneficiary</h1>
            <p class="subtitle" id="subtitle">Fill in the details below to add a new beneficiary</p>
            
            <div class="info-box" id="infoBox" style="display: none;"></div>
            
            <div class="success-message" id="successMessage">Beneficiary added successfully!</div>
            <div class="error-message" id="errorMessage"></div>
            
            <form id="beneficiaryForm"></form>
        </div>
    </div>

    <script type="module">
        import { apiClient } from './api-client.js';

        const container = document.getElementById('formContainer');
        const form = document.getElementById('beneficiaryForm');
        const loading = document.getElementById('loading');
        const successMessage = document.getElementById('successMessage');
        const errorMessage = document.getElementById('errorMessage');
        const transferBadge = document.getElementById('transferBadge');
        const subtitle = document.getElementById('subtitle');
        const infoBox = document.getElementById('infoBox');

        // Get transfer method from URL query params
        const urlParams = new URLSearchParams(window.location.search);
        const transferMethod = urlParams.get('method') || 'LOCAL';

        // Check authentication before loading form
        function checkAuthentication() {
            const authStatus = apiClient.getAuthStatus();
            console.log('[Form] Auth Status:', authStatus);

            if (!authStatus.isAuthenticated) {
                loading.classList.remove('show');
                container.classList.remove('hidden');
                errorMessage.textContent = 'You are not authenticated. Please login first.';
                errorMessage.classList.add('show');
                return false;
            }

            return true;
        }

        // Initialize form
        async function initializeForm() {
            try {
                loading.classList.add('show');

                // Check authentication
                if (!checkAuthentication()) {
                    return;
                }

                // Fetch form schema from API
                const payload = {
                    bank_country_code: 'TH',
                    account_currency: 'THB',
                    entity_type: 'PERSONAL',
                    type: 'BANK_ACCOUNT',
                    transfer_method: transferMethod,
                };

                console.log('[Form] Fetching schema with payload:', payload);
                console.log('[Form] Auth headers:', apiClient.getAuthHeaders());

                const response = await apiClient.post(
                    '/api/auth/airwallex-direct-bank-transfer/beneficiary-form-schemas',
                    payload
                );

                if (!response.data || !response.data.fields) {
                    throw new Error('Invalid response format: missing fields in response');
                }

                console.log('[Form] Schema loaded successfully, fields count:', response.data.fields.length);

                loading.classList.remove('show');
                container.classList.remove('hidden');

                // Update badge and titles
                if (transferMethod === 'SWIFT') {
                    transferBadge.textContent = 'SWIFT Transfer';
                    transferBadge.classList.add('swift');
                    infoBox.textContent = 'SWIFT Transfer: International bank transfers using SWIFT/BIC codes.';
                    infoBox.style.display = 'block';
                } else {
                    transferBadge.textContent = 'LOCAL Transfer';
                    subtitle.textContent = 'Fill in the details below to add a new local bank beneficiary';
                }

                // Build form from API response
                buildForm(response.data.fields);

            } catch (error) {
                console.error('[Form] Error initializing form:', error);
                loading.classList.remove('show');
                container.classList.remove('hidden');
                errorMessage.textContent = 'Error loading form: ' + error.message;
                errorMessage.classList.add('show');
            }
        }

        function buildForm(fields) {
            form.innerHTML = '';

            fields.forEach(fieldItem => {
                if (!fieldItem.enabled) return;

                const field = fieldItem.field;
                const fieldPath = fieldItem.path;
                const isRequired = fieldItem.required;
                const rule = fieldItem.rule;

                const formGroup = document.createElement('div');
                formGroup.className = 'form-group';

                // Label
                const label = document.createElement('label');
                label.htmlFor = field.key;
                label.textContent = field.label;
                if (isRequired) label.classList.add('required');

                // Create input based on type
                let input;

                switch (field.type) {
                    case 'RADIO':
                        input = createRadioGroup(field, isRequired);
                        break;
                    case 'SELECT':
                        input = createSelectInput(field, isRequired);
                        break;
                    case 'TEXT':
                        input = createTextInput(field, isRequired);
                        break;
                    case 'DATE':
                        input = createDateInput(field, isRequired);
                        break;
                    case 'EMAIL':
                        input = createEmailInput(field, isRequired);
                        break;
                    case 'NUMBER':
                        input = createNumberInput(field, isRequired);
                        break;
                    case 'CHECKBOX':
                        input = createCheckboxGroup(field, isRequired);
                        break;
                    default:
                        input = createTextInput(field, isRequired);
                }

                formGroup.appendChild(label);
                formGroup.appendChild(input);

                if (field.tip) {
                    const tip = document.createElement('div');
                    tip.className = 'help-text';
                    tip.textContent = field.tip;
                    formGroup.appendChild(tip);
                }

                form.appendChild(formGroup);
            });

            // Add submit button
            const submitBtn = document.createElement('button');
            submitBtn.type = 'submit';
            submitBtn.textContent = `Add Beneficiary (${transferMethod})`;
            form.appendChild(submitBtn);

            // Add form submit handler
            form.addEventListener('submit', handleSubmit);
        }

        function createTextInput(field, isRequired) {
            const input = document.createElement('input');
            input.type = 'text';
            input.name = field.key;
            input.id = field.key;
            input.placeholder = field.placeholder || '';
            if (field.example) input.placeholder = `e.g., ${field.example}`;
            if (isRequired) input.required = true;
            if (field.default) input.value = field.default;
            return input;
        }

        function createDateInput(field, isRequired) {
            const input = document.createElement('input');
            input.type = 'date';
            input.name = field.key;
            input.id = field.key;
            if (isRequired) input.required = true;
            if (field.default) input.value = field.default;
            return input;
        }

        function createEmailInput(field, isRequired) {
            const input = document.createElement('input');
            input.type = 'email';
            input.name = field.key;
            input.id = field.key;
            input.placeholder = field.placeholder || '';
            if (isRequired) input.required = true;
            if (field.default) input.value = field.default;
            return input;
        }

        function createNumberInput(field, isRequired) {
            const input = document.createElement('input');
            input.type = 'number';
            input.name = field.key;
            input.id = field.key;
            input.placeholder = field.placeholder || '';
            if (isRequired) input.required = true;
            if (field.default) input.value = field.default;
            return input;
        }

        function createRadioGroup(field, isRequired) {
            const div = document.createElement('div');
            div.className = 'radio-group';

            field.options.forEach(option => {
                const radioOption = document.createElement('div');
                radioOption.className = 'radio-option';

                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = field.key;
                radio.id = `${field.key}_${option.value}`;
                radio.value = option.value;
                if (field.default === option.value) radio.checked = true;
                if (isRequired) radio.required = true;

                const label = document.createElement('label');
                label.htmlFor = radio.id;
                label.textContent = option.label;

                radioOption.appendChild(radio);
                radioOption.appendChild(label);
                div.appendChild(radioOption);
            });

            return div;
        }

        function createSelectInput(field, isRequired) {
            const select = document.createElement('select');
            select.name = field.key;
            select.id = field.key;
            if (isRequired) select.required = true;

            const defaultOption = document.createElement('option');
            defaultOption.value = '';
            defaultOption.textContent = `Select ${field.label.toLowerCase()}`;
            select.appendChild(defaultOption);

            field.options.forEach(option => {
                const opt = document.createElement('option');
                opt.value = option.value;
                opt.textContent = option.label;
                if (field.default === option.value) opt.selected = true;
                select.appendChild(opt);
            });

            return select;
        }

        function createCheckboxGroup(field, isRequired) {
            const div = document.createElement('div');
            div.className = 'checkbox-group';

            field.options.forEach(option => {
                const checkboxOption = document.createElement('div');
                checkboxOption.className = 'checkbox-option';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.name = `${field.key}[]`;
                checkbox.id = `${field.key}_${option.value}`;
                checkbox.value = option.value;

                const label = document.createElement('label');
                label.htmlFor = checkbox.id;
                label.textContent = option.label;

                checkboxOption.appendChild(checkbox);
                checkboxOption.appendChild(label);
                div.appendChild(checkboxOption);
            });

            return div;
        }

        async function handleSubmit(e) {
            e.preventDefault();
            successMessage.classList.remove('show');
            errorMessage.classList.remove('show');

            const formData = new FormData(form);
            const payload = {
                bank_country_code: 'TH',
                account_currency: 'THB',
                type: 'BANK_ACCOUNT',
                transfer_method: transferMethod,
            };

            // Add form fields to payload
            for (const [key, value] of formData.entries()) {
                payload[key] = value;
            }

            try {
                console.log('[Form] Submitting beneficiary with payload:', payload);

                const response = await apiClient.post(
                    '/api/auth/airwallex-direct-bank-transfer/beneficiary-form-schemas',
                    payload
                );

                console.log('[Form] Submit response:', response);

                successMessage.textContent = response.message || 'Beneficiary added successfully!';
                successMessage.classList.add('show');
                form.reset();
                setTimeout(() => {
                    successMessage.classList.remove('show');
                }, 3000);

            } catch (error) {
                console.error('[Form] Submit error:', error);
                errorMessage.textContent = 'Error: ' + error.message;
                errorMessage.classList.add('show');
            }
        }

        // Initialize on page load
        initializeForm();
    </script>
</body>
</html>
