<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Beneficiary - Local Transfer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .badge {
            display: inline-block;
            background: #2ecc71;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        
        .required::after {
            content: " *";
            color: #e74c3c;
        }
        
        input[type="text"],
        input[type="email"],
        input[type="date"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        
        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="date"]:focus,
        input[type="number"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        
        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        
        .radio-option input[type="radio"] {
            cursor: pointer;
        }
        
        .radio-option label {
            margin: 0;
            cursor: pointer;
            font-weight: 400;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
        
        .help-text {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .success-message {
            display: none;
            background: #2ecc71;
            color: white;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .error-message {
            display: none;
            background: #e74c3c;
            color: white;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">LOCAL Transfer</div>
        <h1>Add Beneficiary</h1>
        <p class="subtitle">Fill in the details below to add a new local bank beneficiary</p>
        
        <div class="success-message" id="successMessage">Beneficiary added successfully!</div>
        <div class="error-message" id="errorMessage"></div>
        
        <form id="beneficiaryForm">
            <!-- Account Holder Type -->
            <div class="form-group">
                <label class="required">Type of account holder</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="personal" name="entity_type" value="PERSONAL" checked>
                        <label for="personal">Personal</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="business" name="entity_type" value="COMPANY">
                        <label for="business">Business</label>
                    </div>
                </div>
            </div>
            
            <!-- Date of Birth -->
            <div class="form-group">
                <label class="required">Date of Birth</label>
                <input type="date" id="date_of_birth" name="date_of_birth" required>
                <div class="help-text">Required for personal accounts</div>
            </div>
            
            <!-- Account Number -->
            <div class="form-group">
                <label class="required">Account Number</label>
                <input type="text" id="account_number" name="account_number" placeholder="Enter account number" required>
            </div>
            
            <!-- Account Name -->
            <div class="form-group">
                <label class="required">Account Name</label>
                <input type="text" id="account_name" name="account_name" placeholder="Enter account holder name" required>
            </div>
            
            <!-- SWIFT Code -->
            <div class="form-group">
                <label>SWIFT Code</label>
                <input type="text" id="swift_code" name="swift_code" placeholder="Optional: Enter SWIFT code">
                <div class="help-text">Leave blank for local transfers</div>
            </div>
            
            <!-- Address Information -->
            <div class="form-group">
                <label class="required">Street Address</label>
                <input type="text" id="street_address" name="street_address" placeholder="Enter street address" required>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label class="required">City</label>
                    <input type="text" id="city" name="city" placeholder="City" required>
                </div>
                <div class="form-group">
                    <label>State/Province</label>
                    <input type="text" id="state" name="state" placeholder="State">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label class="required">Postal Code</label>
                    <input type="text" id="postcode" name="postcode" placeholder="Postal code" required>
                </div>
                <div class="form-group">
                    <label class="required">Country</label>
                    <input type="text" id="country_code" name="country_code" placeholder="Country code" value="TH" required>
                </div>
            </div>
            
            <!-- Beneficiary Contact Info -->
            <div class="form-group">
                <label class="required">Email Address</label>
                <input type="email" id="personal_email" name="personal_email" placeholder="Enter email address" required>
            </div>
            
            <!-- Nickname -->
            <div class="form-group">
                <label>Nickname</label>
                <input type="text" id="nickname" name="nickname" placeholder="Optional: Give this beneficiary a nickname">
                <div class="help-text">Makes it easier to identify this beneficiary</div>
            </div>
            
            <button type="submit">Add Beneficiary</button>
        </form>
    </div>
    
    <script>
        const form = document.getElementById('beneficiaryForm');
        const successMessage = document.getElementById('successMessage');
        const errorMessage = document.getElementById('errorMessage');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Hide messages
            successMessage.style.display = 'none';
            errorMessage.style.display = 'none';
            
            // Collect form data
            const formData = new FormData(form);
            
            // Add required fields
            formData.append('bank_country_code', 'TH');
            formData.append('account_currency', 'THB');
            formData.append('type', 'BANK_ACCOUNT');
            formData.append('transfer_method', 'LOCAL');
            
            try {
                // Get the token from localStorage (you'll need to set this from your login)
                const token = localStorage.getItem('accessToken');
                
                const response = await fetch('/api/auth/airwallex-direct-bank-transfer/beneficiary-form-schemas', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams(formData)
                });
                
                if (response.ok) {
                    successMessage.style.display = 'block';
                    form.reset();
                    document.getElementById('personal').checked = true;
                    document.getElementById('country_code').value = 'TH';
                } else {
                    const error = await response.json();
                    errorMessage.textContent = error.error?.message || 'Failed to add beneficiary';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                errorMessage.textContent = 'Error: ' + error.message;
                errorMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
